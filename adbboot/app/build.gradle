plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.opentv.adbboot'
    compileSdk 35

    defaultConfig {
        applicationId 'com.opentv.adbboot'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // Fixed debug keystore (committed, same file as the other usefulapks
    // apps) so every CI build shares one signature and `adb install -r`
    // updates work across versions.
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Shizuku — run shell commands as the shell user (uid 2000) without
    // root, so the app can switch adbd to TCP 5555. Pinned to 12.2.0 on
    // purpose: Shizuku.newProcess() is public there, and from 13.0 it is
    // private/deprecated (the replacement is a UserService, which is far
    // more code for one shell command). Both artifacts are on Maven
    // Central as .aar.
    implementation 'dev.rikka.shizuku:api:12.2.0'
    implementation 'dev.rikka.shizuku:provider:12.2.0'

    testImplementation 'junit:junit:4.13.2'
}
