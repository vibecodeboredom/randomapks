name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build Settings Launcher
        run: ./gradlew assembleDebug --no-daemon
        working-directory: settingslauncher

      - name: Build DevOptions
        run: ./gradlew assembleDebug --no-daemon
        working-directory: devoptions

      - name: Upload Settings Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: SettingsLauncher-debug
          path: settingslauncher/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload DevOptions APK
        uses: actions/upload-artifact@v4
        with:
          name: DevOptions-debug
          path: devoptions/app/build/outputs/apk/debug/app-debug.apk
